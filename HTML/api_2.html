<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora de Vinos - Catálogo Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-red-950 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider">🍇 DISTRIBUIDORA DE VINOS</h1>
            <div class="relative">
                <button class="bg-red-800 hover:bg-red-700 px-4 py-2 rounded-lg flex items-center space-x-2 transition">
                    <span>🛒 Carrito</span>
                    <span id="cart-count" class="bg-white text-red-950 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <h2 class="text-3xl font-extrabold text-gray-800 mb-6 border-b pb-2">Catálogo de Vinos Importados</h2>
        
        <div id="loading" class="text-center py-12">
            <p class="text-xl text-gray-500 animate-pulse">Conectando con la API de Vinos...</p>
        </div>

        <div id="catalog-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            </div>
    </main>

    <script>
        // Nueva API pública y estable de vinos tintos
        const API_URL = 'https://api.sampleapis.com/wines/reds';
        
        let cartCount = 0;

        function addToCart() {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
        }

        async function loadCatalog() {
            try {
                const response = await fetch(API_URL);
                const products = await response.json();
                
                const container = document.getElementById('catalog-container');
                const loading = document.getElementById('loading');
                
                container.innerHTML = '';

                // Limitamos a los primeros 20 vinos para no saturar el maquetado inicial
                const primerosVinos = products.slice(0, 20);

                primerosVinos.forEach(wine => {
                    // Creamos un precio ficticio basado en el id para simular el e-commerce
                    const fakePrice = (wine.id * 1250) + 3500; 
                    
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 flex flex-col justify-between border border-gray-200';
                    
                    // Manejo de error si la imagen de la API viene rota o vacía
                    const wineImage = wine.image ? wine.image : 'https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=500&q=80';

                    card.innerHTML = `
                        <div>
                            <div class="relative h-56 bg-gray-50 p-4 flex items-center justify-center">
                                <img src="${wineImage}" alt="${wine.wine}" class="h-full object-contain mix-blend-multiply" onerror="this.src='https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=500&q=80'; this.className='w-full h-full object-cover'">
                            </div>
                            
                            <div class="p-4">
                                <p class="text-xs text-red-800 uppercase tracking-widest font-bold">${wine.location || 'Procedencia Internacional'}</p>
                                <h3 class="text-lg font-bold text-gray-800 mt-1 line-clamp-2">${wine.wine}</h3>
                                <p class="text-xs inline-block bg-gray-100 text-gray-600 px-2 py-0.5 rounded mt-2">
                                    Bodega: ${wine.winery}
                                </p>
                            </div>
                        </div>

                        <div class="p-4 border-t border-gray-100 bg-gray-50">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xl font-black text-gray-900">$${fakePrice.toLocaleString('es-AR')}</span>
                                <span class="text-xs text-amber-500 font-bold">⭐ ${wine.rating.average}</span>
                            </div>
                            <button onclick="addToCart()" class="w-full bg-red-950 hover:bg-red-900 text-white font-medium py-2 rounded-lg transition-colors duration-200 text-sm">
                                Añadir al pedido
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });

                // Mostrar catálogo, ocultar loader
                loading.classList.add('hidden');
                container.classList.remove('hidden');

            } catch (error) {
                console.error("Error cargando los datos:", error);
                document.getElementById('loading').innerHTML = `
                    <div class="p-4 max-w-md mx-auto bg-red-50 text-red-800 rounded-lg border border-red-200">
                        <p class="font-bold">Error de conexión</p>
                        <p class="text-sm">No se pudo conectar con la API de pruebas. Por favor, refrescá la página.</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadCatalog);
    </script>
</body>
</html>
